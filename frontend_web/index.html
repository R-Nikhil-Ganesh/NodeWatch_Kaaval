      tailwind.config = {

                300: '#F1A055',
                400: '#EC8A2E',
                500: '#E8720C',
                600: '#C25F09',
                700: '#9C4C08',

                900: '#4F2704'

                200: '#E4E8EE',

              // Only used by the embedded Legal app pages (font-serif).
              serif: ['"Noto Serif"', 'Georgia', 'serif']
            },
            // Only referenced by the embedded Legal app pages — "gov"-themed
            // components never use shadow-card or rounded-sm, so this is
            // additive and doesn't change any existing look.

              card: '0 1px 2px rgba(11, 37, 69, 0.06), 0 1px 1px rgba(11, 37, 69, 0.04)'
            },
            borderRadius: {
              sm: '6px'
            }
          }
        }
      }

    <style>
      body {
        /* Default light mode styles, dark mode handled by classes on body/html */
        transition: background-color 0.3s, color 0.3s;
      }
